resources:
  jobs:
    dab_silver_cabecalho_preflight:
      name: dab-silver-cabecalho-preflight-${bundle.target}
      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_root
          default: ${var.source_root}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: control_schema
          default: ${var.control_schema}

      tasks:
        - task_key: silver_cabecalho_preflight
          environment_key: probe_runtime
          notebook_task:
            notebook_path: ../notebooks/troubleshooting/85_dab_silver_cabecalho_preflight.py
            source: WORKSPACE

      environments:
        - environment_key: probe_runtime
          spec:
            environment_version: "2"
