resources:
  jobs:
    dab_bronze_json_first_load:
      name: dab-bronze-json-first-load-${bundle.target}
      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_root
          default: ${var.source_root}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: control_schema
          default: ${var.control_schema}

      tasks:
        - task_key: bronze_json_first_load
          environment_key: bronze_runtime
          notebook_task:
            notebook_path: ../notebooks/bronze/04_bronze_json_sources.py
            source: WORKSPACE

      environments:
        - environment_key: bronze_runtime
          spec:
            environment_version: "2"
            dependencies:
              - "pandas>=2.2,<3"
              - "openpyxl>=3.1,<4"
