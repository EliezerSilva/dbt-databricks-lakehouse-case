resources:
  jobs:
    enterprise_lakehouse_pipeline:
      name: lakehouse-dab-${bundle.target}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: '0 0 0 * * ?'
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_root
          default: ${var.source_root}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: control_schema
          default: ${var.control_schema}
      tasks:
        - task_key: 01_bronze_pedidos_cabecalho
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/bronze/01_bronze_pedidos_cabecalho.py
            source: WORKSPACE
        - task_key: 02_bronze_pedidos_itens
          depends_on:
            - task_key: 01_bronze_pedidos_cabecalho
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/bronze/02_bronze_pedidos_itens.py
            source: WORKSPACE
        - task_key: 03_bronze_cadastros
          depends_on:
            - task_key: 02_bronze_pedidos_itens
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/bronze/03_bronze_cadastros.py
            source: WORKSPACE
        - task_key: 04_bronze_json_sources
          depends_on:
            - task_key: 03_bronze_cadastros
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/bronze/04_bronze_json_sources.py
            source: WORKSPACE
        - task_key: 01_silver_pedidos_cabecalho
          depends_on:
            - task_key: 04_bronze_json_sources
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/silver/01_silver_pedidos_cabecalho.py
            source: WORKSPACE
        - task_key: 02_silver_pedidos_itens
          depends_on:
            - task_key: 01_silver_pedidos_cabecalho
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/silver/02_silver_pedidos_itens.py
            source: WORKSPACE
        - task_key: 03_silver_cadastros
          depends_on:
            - task_key: 02_silver_pedidos_itens
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/silver/03_silver_cadastros.py
            source: WORKSPACE
        - task_key: 04_silver_json_sources
          depends_on:
            - task_key: 03_silver_cadastros
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/silver/04_silver_json_sources.py
            source: WORKSPACE
        - task_key: 01_gold_dimensoes
          depends_on:
            - task_key: 04_silver_json_sources
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/gold/01_gold_dimensoes.py
            source: WORKSPACE
        - task_key: 02_gold_fato_pedidos
          depends_on:
            - task_key: 01_gold_dimensoes
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/gold/02_gold_fato_pedidos.py
            source: WORKSPACE
        - task_key: 03_gold_metricas
          depends_on:
            - task_key: 02_gold_fato_pedidos
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/gold/03_gold_metricas.py
            source: WORKSPACE
        - task_key: 04_gold_vw_kpis_pedidos
          depends_on:
            - task_key: 03_gold_metricas
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/gold/04_gold_vw_kpis_pedidos.py
            source: WORKSPACE
        - task_key: 99_data_quality_checks
          depends_on:
            - task_key: 04_gold_vw_kpis_pedidos
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/troubleshooting/99_data_quality_checks.py
            source: WORKSPACE
        - task_key: 90_evidencias_validacao
          depends_on:
            - task_key: 99_data_quality_checks
          environment_key: lakehouse_runtime
          notebook_task:
            notebook_path: ../notebooks/troubleshooting/90_evidencias_validacao.py
            source: WORKSPACE

      environments:
        - environment_key: lakehouse_runtime
          spec:
            environment_version: "2"
            dependencies:
              - "pandas>=2.2,<3"
              - "openpyxl>=3.1,<4"
