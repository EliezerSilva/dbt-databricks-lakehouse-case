version: 2

models:
  - name: dim_canal
    description: Dimensao de canais. Paridade com workspace.gold.dim_canal (PySpark).
    data_tests:
      - reconciles_with:
          arguments:
            compare_model: source('pyspark_gold', 'dim_canal')
            columns: [sk_canal, canal_id, nome_canal, tipo_canal, ativo]
    columns:
      - name: sk_canal
        description: sha2(canal_id, 256) sobre o valor cru, sem normalizacao.
        data_tests:
          - unique
          - not_null
      - name: canal_id
        data_tests:
          - unique
          - not_null
      - name: nome_canal
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: tipo_canal
        data_tests:
          - accepted_values:
              arguments:
                values: ["Direto", "Indireto", "Digital"]
      - name: ativo
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: dim_regiao
    description: Dimensao de regioes. Paridade com workspace.gold.dim_regiao (PySpark).
    data_tests:
      - reconciles_with:
          arguments:
            compare_model: source('pyspark_gold', 'dim_regiao')
            columns: [sk_regiao, regional_code, nome_regiao, estado_sede, gestor]
    columns:
      - name: sk_regiao
        description: sha2(regional_code, 256) apos a normalizacao feita na Silver.
        data_tests:
          - unique
          - not_null
      - name: regional_code
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["CO", "N", "NE", "S", "SE"]
      - name: nome_regiao
        data_tests:
          - not_null
      - name: estado_sede
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: gestor
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: dim_vendedor
    description: Dimensao de vendedores. Paridade com workspace.gold.dim_vendedor (PySpark).
    data_tests:
      - reconciles_with:
          arguments:
            compare_model: source('pyspark_gold', 'dim_vendedor')
            columns: [sk_vendedor, seller_id, nome_vendedor, canal_id, regional_code, data_admissao, status]
    columns:
      - name: sk_vendedor
        description: sha2(seller_id, 256) sobre o valor cru.
        data_tests:
          - unique
          - not_null
      - name: seller_id
        data_tests:
          - unique
          - not_null
      - name: nome_vendedor
        data_tests:
          - not_null
      - name: canal_id
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_canal')
                field: canal_id
      - name: regional_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_regiao')
                field: regional_code
              config:
                where: "regional_code <> 'NAO_INFORMADO'"
      - name: data_admissao
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["Ativo", "Inativo", "NAO_INFORMADO"]

  - name: dim_cliente
    description: Dimensao de clientes (SCD1, versao mais recente). Paridade com workspace.gold.dim_cliente exceto divergencias declaradas.
    data_tests:
      - reconciles_with:
          arguments:
            compare_model: source('pyspark_gold', 'dim_cliente')
            columns: [sk_cliente, customer_id, nome_cliente, segmento, porte, cidade, estado, email, data_cadastro, status_cliente]
            exceptions: ref('reconciliacao_excecoes')
            key_column: customer_id
    columns:
      - name: sk_cliente
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [unique, not_null]
      - name: nome_cliente
        data_tests: [not_null]
      - name: estado
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"]
      - name: segmento
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ["Educação", "Financeiro", "Indústria", "Saúde", "Serviços", "Varejo"]
      - name: porte
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ["Grande", "Média", "Pequena"]
      - name: status_cliente
        data_tests:
          - accepted_values:
              arguments:
                values: ["Ativo", "Inativo", "NAO_INFORMADO"]
      - name: email
        data_tests:
          - not_null:
              config:
                severity: warn
          - like_pattern:
              arguments:
                pattern: "%@%"
              config:
                severity: warn
      - name: data_cadastro
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: dim_produto
    description: Dimensao de produtos (SCD1, versao mais recente). Paridade com workspace.gold.dim_produto exceto divergencias declaradas.
    data_tests:
      - reconciles_with:
          arguments:
            compare_model: source('pyspark_gold', 'dim_produto')
            columns: [sk_produto, product_id, nome_produto, categoria, subcategoria, familia, preco_lista, currency, tags_csv, status]
            exceptions: ref('reconciliacao_excecoes')
            key_column: product_id
    columns:
      - name: sk_produto
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [unique, not_null]
      - name: nome_produto
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: categoria
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Assinatura", "Hardware", "Serviços", "Software"]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["Ativo", "Descontinuado", "Inativo", "NAO_INFORMADO"]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ["BRL"]
      - name: preco_lista
        data_tests:
          - castable_to_double:
              config:
                severity: warn

  - name: dim_data
    description: Calendario diario de (min - 30) a (max + 30) das datas de pedidos e entregas. Paridade com workspace.gold.dim_data.
    data_tests:
      - reconciles_with:
          arguments:
            compare_model: source('pyspark_gold', 'dim_data')
            columns: [data, sk_data, ano, mes, dia, trimestre, semana_ano, nome_mes, dia_semana_iso, nome_dia_semana, flag_fim_semana, ano_mes]
    columns:
      - name: data
        data_tests: [unique, not_null]
      - name: sk_data
        data_tests: [unique, not_null]
      - name: dia_semana_iso
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: flag_fim_semana
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: nome_mes
        data_tests:
          - accepted_values:
              arguments:
                values: ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"]
      - name: nome_dia_semana
        data_tests:
          - accepted_values:
              arguments:
                values: ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"]

  - name: fato_pedidos
    description: Fato de itens de pedido (1 linha por item com cabecalho). Paridade com workspace.gold.fato_pedidos.
    data_tests:
      - unique_combination:
          arguments:
            columns: [order_id, item_seq]
      - reconciles_with:
          arguments:
            compare_model: source('pyspark_gold', 'fato_pedidos')
            columns: [order_id, item_seq, sk_cliente, sk_produto, sk_canal, sk_regiao, sk_vendedor, sk_data_pedido, sk_data_prevista, quantidade, valor_unitario, valor_item, receita_liquida_item, valor_bruto_pedido, valor_desconto_pedido, valor_liquido_pedido, custo_entrega, tempo_entrega_dias, status_order, item_status, status_entrega, flag_cancelado, flag_atrasado, dias_atraso, flag_tem_ocorrencia, qtd_ocorrencias, flag_cancel_request, flag_devolucao, data_pedido, data_prevista_entrega, data_envio, data_entrega_real, order_source]
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: item_seq
        data_tests: [not_null]
      - name: sk_cliente
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_cliente')
                field: sk_cliente
      - name: sk_produto
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_produto')
                field: sk_produto
      - name: sk_vendedor
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_vendedor')
                field: sk_vendedor
      - name: sk_canal
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_canal')
                field: sk_canal
      - name: sk_regiao
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_regiao')
                field: sk_regiao
      - name: sk_data_pedido
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_data')
                field: sk_data
      - name: flag_cancelado
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: flag_atrasado
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: flag_tem_ocorrencia
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: flag_cancel_request
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: flag_devolucao
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: custo_entrega
        data_tests:
          - castable_to_double:
              config:
                severity: warn

  - name: itens_sem_cabecalho
    description: Itens cujo order_id nao existe no cabecalho (orfaos). View idempotente.
