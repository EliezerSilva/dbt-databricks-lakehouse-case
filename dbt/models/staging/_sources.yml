version: 2

sources:
  - name: silver
    description: Silver PySpark original (somente leitura).
    database: workspace
    schema: "{{ var('silver_schema', 'silver') }}"
    tables:
      - name: silver_canais
        columns:
          - name: id_canal
            data_tests:
              - not_null
              - unique:
                  config:
                    severity: warn

      - name: silver_regioes
        description: Deduplicada na Silver PySpark (row_number por regional_code, preferindo state = SP).
        columns:
          - name: regional_code
            data_tests:
              - not_null
              - unique

      - name: silver_vendedores
        description: Sem deduplicacao na Silver PySpark; seller_id duplicado em V004 e V008.
        columns:
          - name: seller_id
            data_tests:
              - not_null
              - unique:
                  config:
                    severity: warn

      - name: silver_clientes
        description: Sem deduplicacao na Silver PySpark; customer_id duplicado em C0010, C0025 e c0051.
        columns:
          - name: customer_id
            data_tests:
              - not_null
              - unique:
                  config:
                    severity: warn
          - name: updated_at
            data_tests:
              - not_null:
                  config:
                    severity: warn

      - name: silver_produtos
        description: Sem deduplicacao na Silver PySpark; product_id duplicado em P0006.
        columns:
          - name: product_id
            data_tests:
              - not_null
              - unique:
                  config:
                    severity: warn
          - name: updated_at
            data_tests:
              - not_null:
                  config:
                    severity: warn

  - name: pyspark_gold
    description: Gold PySpark original, baseline de reconciliacao (somente leitura).
    database: workspace
    schema: "{{ var('gold_schema', 'gold') }}"
    tables:
      - name: dim_canal
      - name: dim_regiao
      - name: dim_vendedor
      - name: dim_cliente
      - name: dim_produto
