version: 2

seeds:
  - name: reconciliacao_excecoes
    description: Divergencias intencionais em relacao ao baseline PySpark (modelo, chave, motivo).

  - name: fixture_reconcilia_modelo
    description: Fixture de regressao do reconciles_with. Linha (1, a) duplicada.
    data_tests:
      - reconciles_with:
          arguments:
            compare_model: ref('fixture_reconcilia_baseline')
            columns: [id, valor]
          config:
            error_if: "!=2"
            warn_if: "!=2"

  - name: fixture_reconcilia_baseline
    description: Fixture de regressao do reconciles_with e do contrato_schema. Linhas (1, a) e (2, b).
    data_tests:
      - contrato_schema:
          arguments:
            colunas: {id: bigint, valor: int, coluna_removida: string}
          config:
            error_if: "!=2"
            warn_if: "!=2"

  - name: cabecalhos_tardios
    description: >
      SIMULACAO. Cabecalho sintetico do pedido O00021, cujos itens estao em quarentena por falta de cabecalho.
      So entra no stg_pedidos_cabecalho com a variavel simular_cabecalho_tardio, e nunca no schema dbt (ambiente real).
    config:
      column_types:
        order_date: date
        promised_date: date
        gross_amount: double
        discount_amount: double
        net_amount: double
        last_update: timestamp
        processing_timestamp: timestamp
