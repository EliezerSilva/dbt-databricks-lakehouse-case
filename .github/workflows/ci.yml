name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agente:
    name: agente - testes unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m unittest discover -s tests/agent -v

  dbt:
    name: dbt - parse e contagem de testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: profile ficticio (parse nao conecta ao Databricks)
        run: |
          mkdir -p "$RUNNER_TEMP/dbt_profiles"
          cat > "$RUNNER_TEMP/dbt_profiles/profiles.yml" <<'YML'
          lakehouse_case:
            target: dev
            outputs:
              dev:
                type: databricks
                host: ci.invalid
                http_path: /sql/1.0/warehouses/ci
                catalog: workspace
                schema: dbt
                token: ci-placeholder
                threads: 1
          YML
      - name: dbt parse
        working-directory: dbt
        run: dbt parse --profiles-dir "$RUNNER_TEMP/dbt_profiles"
      - name: contagem minima de testes
        working-directory: dbt
        run: |
          n=$(dbt ls --resource-type test --quiet --profiles-dir "$RUNNER_TEMP/dbt_profiles" | wc -l)
          echo "testes dbt: $n"
          test "$n" -ge 114
      - name: ontologia contra o manifest
        run: python -m agent.ontologia --manifest dbt/target/manifest.json
