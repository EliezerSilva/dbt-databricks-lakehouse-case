resources:
  jobs:
    agente_quarentena:
      name: agente-quarentena
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 7 ? * MON-FRI"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED

      tasks:
        - task_key: agente
          environment_key: agente_runtime
          spark_python_task:
            python_file: ../../../jobs/agente_quarentena.py
            parameters:
              - ${workspace.file_path}
              - --ambiente
              - original
              - --gravar
              - --profile
              - ""

      environments:
        - environment_key: agente_runtime
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk==0.117.0
              - pyyaml==6.0.3
